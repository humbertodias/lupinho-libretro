name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release (ex. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            artifact: lupinho_libretro.so
          - name: macos
            artifact: lupinho_libretro.dylib
          - name: windows
            artifact: lupinho_libretro.dll
          - name: android
            artifact: lupinho_libretro_android.zip

    steps:
      - uses: actions/checkout@v7

      # actions/checkout recurses into every nested gitlink while setting up
      # submodule auth. lupinho records src/libs/linux/raylib with no URL, and
      # the core does not compile it, so init only the direct submodules.
      - name: Checkout submodules
        run: git submodule update --init --depth 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: make docker PLATFORM=${{ matrix.name }}

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: lupinho-libretro-${{ matrix.name }}
          path: |
            dist/${{ matrix.artifact }}
            dist/lupinho_libretro.info
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download cores
        uses: actions/download-artifact@v7
        with:
          pattern: lupinho-libretro-*
          path: artifacts

      - name: Collect release files
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "tag must look like v0.1.0, got: $tag" >&2; exit 1 ;;
          esac
          echo "name=$tag" >> "$GITHUB_OUTPUT"

          mkdir -p release
          cp artifacts/lupinho-libretro-linux/lupinho_libretro.so release/
          cp artifacts/lupinho-libretro-macos/lupinho_libretro.dylib release/
          cp artifacts/lupinho-libretro-windows/lupinho_libretro.dll release/
          cp artifacts/lupinho-libretro-linux/lupinho_libretro.info release/
          cp artifacts/lupinho-libretro-android/lupinho_libretro_android.zip release/
          unzip -p artifacts/lupinho-libretro-android/lupinho_libretro_android.zip \
            arm64-v8a/lupinho_libretro_android.so > release/lupinho_libretro_android.so
          ls -l release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/lupinho_libretro.so
            release/lupinho_libretro.dylib
            release/lupinho_libretro.dll
            release/lupinho_libretro_android.so
            release/lupinho_libretro_android.zip
            release/lupinho_libretro.info
