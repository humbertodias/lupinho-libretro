name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da release (ex. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: libretro
            artifact: lupinho_libretro.so
          - name: macos
            os: macos-latest
            target: libretro
            artifact: lupinho_libretro.dylib
          - name: windows
            os: ubuntu-latest
            target: libretro-win
            artifact: lupinho_libretro.dll
          - name: android
            os: ubuntu-latest
            target: libretro-android-all
            artifact: lupinho_libretro_android.zip

    steps:
      - uses: actions/checkout@v7

      # actions/checkout recurses into every nested gitlink while setting up
      # submodule auth. lupinho records src/libs/linux/raylib with no URL, and
      # the core does not compile it, so init only the direct submodules.
      - name: Checkout submodules
        run: git submodule update --init --depth 1

      - name: Install Linux deps
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev

      - name: Install MinGW (Windows core)
        if: matrix.name == 'windows'
        run: sudo apt-get update && sudo apt-get install -y make gcc-mingw-w64-x86-64 libz-mingw-w64-dev

      - name: Cache Android NDK
        if: matrix.name == 'android'
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: android-ndk-r28c
          key: android-ndk-r28c-linux

      - name: Install Android NDK
        if: matrix.name == 'android' && steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y make unzip zip curl ca-certificates
          curl -fL --retry 3 -o ndk.zip https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip -q ndk.zip
          rm -f ndk.zip

      - name: Export Android NDK
        if: matrix.name == 'android'
        run: echo "ANDROID_NDK=${GITHUB_WORKSPACE}/android-ndk-r28c" >> "$GITHUB_ENV"

      - name: Build
        run: make ${{ matrix.target }}

      - name: Pack Android cores
        if: matrix.name == 'android'
        run: |
          file dist/android/arm64-v8a/lupinho_libretro_android.so
          file dist/android/armeabi-v7a/lupinho_libretro_android.so
          file dist/android/x86_64/lupinho_libretro_android.so
          file dist/android/x86/lupinho_libretro_android.so
          file dist/android/arm64-v8a/lupinho_libretro_android.so | grep -q "ARM aarch64"
          file dist/android/armeabi-v7a/lupinho_libretro_android.so | grep -q "ARM"
          file dist/android/x86_64/lupinho_libretro_android.so | grep -q "x86-64"
          file dist/android/x86/lupinho_libretro_android.so | grep -q "i386"
          (cd dist/android && zip -r ../lupinho_libretro_android.zip .)

      - name: Upload core
        uses: actions/upload-artifact@v7
        with:
          name: lupinho-libretro-${{ matrix.name }}
          path: |
            dist/${{ matrix.artifact }}
            dist/lupinho_libretro.info
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download cores
        uses: actions/download-artifact@v7
        with:
          pattern: lupinho-libretro-*
          path: artifacts

      - name: Collect release files
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          case "$tag" in
            v*) ;;
            *) echo "tag must look like v0.1.0, got: $tag" >&2; exit 1 ;;
          esac
          echo "name=$tag" >> "$GITHUB_OUTPUT"

          mkdir -p release
          cp artifacts/lupinho-libretro-linux/lupinho_libretro.so release/
          cp artifacts/lupinho-libretro-macos/lupinho_libretro.dylib release/
          cp artifacts/lupinho-libretro-windows/lupinho_libretro.dll release/
          cp artifacts/lupinho-libretro-linux/lupinho_libretro.info release/
          cp artifacts/lupinho-libretro-android/lupinho_libretro_android.zip release/
          unzip -p artifacts/lupinho-libretro-android/lupinho_libretro_android.zip \
            arm64-v8a/lupinho_libretro_android.so > release/lupinho_libretro_android.so
          ls -l release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/lupinho_libretro.so
            release/lupinho_libretro.dylib
            release/lupinho_libretro.dll
            release/lupinho_libretro_android.so
            release/lupinho_libretro_android.zip
            release/lupinho_libretro.info
